# AidatTakip - Supabase (küçültülmüş sürüm)
#
# Sadece uygulamanın kullandığı 4 servis: db, kong, auth, rest.
# Ortam değişkenleri Easypanel'den DEĞİL, sunucudaki /etc/easypanel/aidat-supabase/env/*.env
# dosyalarından okunur (make-env.sh ile mevcut konteynerlerden üretilir).
# Bu dosyada şifre yoktur.
# Veri: /opt/aidat-supabase/volumes (Git klasörünün dışında).

services:

  kong:
    image: kong:2.8.1
    restart: unless-stopped
    env_file:
      - /etc/easypanel/aidat-supabase/env/kong.env
    volumes:
      - /opt/aidat-supabase/volumes/api/kong.yml:/home/kong/temp.yml:ro,z
    entrypoint: bash -c 'eval "echo \"$$(cat ~/temp.yml)\"" > ~/kong.yml &&
      /docker-entrypoint.sh kong docker-start'

  auth:
    image: supabase/gotrue:v2.184.0
    restart: unless-stopped
    env_file:
      - /etc/easypanel/aidat-supabase/env/auth.env
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:9999/health"
        ]
      timeout: 5s
      interval: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy

  rest:
    image: postgrest/postgrest:v14.1
    restart: unless-stopped
    env_file:
      - /etc/easypanel/aidat-supabase/env/rest.env
    depends_on:
      db:
        condition: service_healthy
    command: [ "postgrest" ]

  db:
    image: supabase/postgres:15.8.1.085
    restart: unless-stopped
    env_file:
      - /etc/easypanel/aidat-supabase/env/db.env
    volumes:
      - /opt/aidat-supabase/volumes/db/data:/var/lib/postgresql/data:Z
      - db-config:/etc/postgresql-custom
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres", "-h", "localhost" ]
      interval: 5s
      timeout: 5s
      retries: 10
    command:
      [
        "postgres",
        "-c",
        "config_file=/etc/postgresql/postgresql.conf",
        "-c",
        "log_min_messages=fatal"
      ]

volumes:
  db-config:
